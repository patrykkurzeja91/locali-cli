name: Publish Locali to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (symulacja publikacji)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & Publish to npmjs.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js with NPM registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Locali
        run: npm run build

      - name: Publish to NPM (Dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public

      - name: Publish to NPM
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
